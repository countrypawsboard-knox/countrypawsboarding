
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Paws | Admin Dashboard</title>

<style>
:root {
  --brown:#38291f;
  --dark:#241d17;
  --olive:#626044;
  --cream:#f0e8d5;
  --gold:#d6b66b;
  --wood:#8b735d;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--dark);
  color:var(--cream);
  font-family:Arial,sans-serif;
  line-height:1.6;
}
header {
  background:var(--brown);
  padding:20px;
  text-align:center;
  border-bottom:3px solid var(--olive);
}
header h1 {margin:0;font-family:Georgia,serif}
main {max-width:1100px;margin:35px auto;padding:0 18px}
h2,h3 {font-family:Georgia,serif;color:var(--gold)}
.panel {
  background:var(--brown);
  border:1px solid var(--wood);
  border-radius:7px;
  padding:22px;
  margin-bottom:22px;
}
input,textarea {
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  border:1px solid var(--wood);
  border-radius:4px;
  background:var(--cream);
  color:var(--dark);
  font-size:15px;
}
button {
  padding:11px 17px;
  border:0;
  border-radius:4px;
  background:var(--gold);
  color:var(--dark);
  font-weight:bold;
  cursor:pointer;
  margin:5px 5px 5px 0;
}
button:disabled {opacity:.5;cursor:not-allowed}
button.danger {background:#a94c3f;color:white}
button.secondary {background:var(--olive);color:white}
.hidden {display:none!important}
.muted {color:#c8bdac}
.booking {
  background:#303527;
  padding:18px;
  margin:15px 0;
  border-radius:5px;
  border-left:4px solid var(--gold);
}
.details {
  background:#241d17;
  padding:16px;
  margin-top:15px;
  border-radius:4px;
  overflow-wrap:anywhere;
}
.detail-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.detail-item {
  padding:9px;
  border-bottom:1px solid #695746;
}
.detail-item strong {
  display:block;
  color:var(--gold);
  font-size:13px;
}
.status {color:var(--gold);font-weight:bold}
#message {padding:12px;margin:12px 0;border-radius:4px}
.error {background:#642e27}
.success {background:#28452f}
footer {text-align:center;color:#aaa18f;padding:25px}
@media(max-width:600px) {
  .detail-grid {grid-template-columns:1fr}
  .panel {padding:16px}
}
</style>
</head>

<body>
<header>
<h1>Country Paws Boarding</h1>
<div>Private Administration Dashboard</div>
</header>

<main>

<div id="loginPanel" class="panel">
<h2>Administrator Login</h2>
<p class="muted">Enter your private administrator token.</p>

<form id="loginForm">
<label for="token">Admin Token</label>
<input id="token" type="password" required autocomplete="current-password">
<button type="submit">Log In</button>
</form>
</div>

<div id="dashboard" class="hidden">

<div class="panel">
<h2>Reservation Management</h2>
<p class="muted">Review reservation requests before approving or declining them.</p>
<button id="refreshButton">Refresh Requests</button>
<button id="logoutButton" class="secondary">Log Out</button>
<div id="message" role="status" aria-live="polite"></div>
</div>

<div class="panel">
<h2>Pending Requests</h2>
<div id="bookings">
<p class="muted">Loading requests...</p>
</div>
</div>

</div>
</main>

<footer>Country Paws Boarding · Private Admin Area</footer>

<script>
const API = "https://country-paws-booking.countrypawsboard.workers.dev";

const $ = id => document.getElementById(id);

let adminToken = "";

function message(text,type="success") {
  $("message").className = type;
  $("message").textContent = text;
}

function formatDate(date) {
  if (!date) return "Not provided";
  return new Date(date+"T12:00:00").toLocaleDateString("en-US",{
    month:"long",day:"numeric",year:"numeric"
  });
}

function formatTime(time) {
  if (!time) return "Not provided";
  const [h,m] = time.split(":").map(Number);
  return `${h%12||12}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`;
}

function addDetail(container,label,value) {
  const item = document.createElement("div");
  item.className = "detail-item";

  const heading = document.createElement("strong");
  heading.textContent = label;

  const content = document.createElement("span");
  content.textContent = value || "Not provided";

  item.append(heading,content);
  container.appendChild(item);
}

function addSection(parent,title,fields,booking) {
  const section = document.createElement("div");
  section.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = title;
  section.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "detail-grid";

  fields.forEach(([label,key]) => {
    addDetail(grid,label,booking[key]);
  });

  section.appendChild(grid);
  parent.appendChild(section);
}

function renderBooking(booking) {
  const card = document.createElement("div");
  card.className = "booking";

  const title = document.createElement("h3");
  title.textContent = booking.dog_name + " — " + booking.owner_name;

  const status = document.createElement("p");
  status.className = "status";
  status.textContent = "PENDING APPROVAL";

  const summary = document.createElement("p");
  summary.textContent =
    formatDate(booking.check_in) + " at " +
    formatTime(booking.check_in_time) + " → " +
    formatDate(booking.check_out) + " at " +
    formatTime(booking.check_out_time);

  const total = document.createElement("p");
  total.textContent =
    booking.nights + " nights · $" + booking.total_price;

  const code = document.createElement("p");
  code.textContent = "Confirmation code: " + booking.confirmation_code;

  const detailsButton = document.createElement("button");
  detailsButton.textContent = "View Full Dog & Owner Information";

  const details = document.createElement("div");
  details.className = "details hidden";

  detailsButton.addEventListener("click",() => {
    details.classList.toggle("hidden");
    detailsButton.textContent = details.classList.contains("hidden")
      ? "View Full Dog & Owner Information"
      : "Hide Full Information";
  });

  addSection(details,"Owner Information",[
    ["Owner Name","owner_name"],
    ["Email","email"],
    ["Phone","phone"]
  ],booking);

  addSection(details,"Dog Information",[
    ["Dog Name","dog_name"],
    ["Breed","dog_breed"],
    ["Age","dog_age"]
  ],booking);

  addSection(details,"Health & Medical",[
    ["Medication","medication"],
    ["Medication Details","medication_details"],
    ["Vaccinations Up To Date","vaccination_status"],
    ["Vaccination Details","vaccination_details"],
    ["Allergies","allergies"],
    ["Allergy Details","allergy_details"],
    ["Medical Conditions","medical_conditions"],
    ["Medical Details","medical_details"]
  ],booking);

  addSection(details,"Behavior & Personality",[
    ["Bite / Aggression History","bite_history"],
    ["Bite Details","bite_details"],
    ["Separation Anxiety","separation_anxiety"],
    ["House Trained","house_trained"],
    ["Behavior Around Dogs","dog_behavior"]
  ],booking);

  addSection(details,"Feeding & Care",[
    ["Food Amount","feeding_amount"],
    ["Meals Per Day","meals_per_day"],
    ["Care Instructions","care_instructions"],
    ["Fears","fears"]
  ],booking);

  addSection(details,"Emergency & Veterinarian",[
    ["Emergency Contact","emergency_contact_name"],
    ["Emergency Phone","emergency_contact_phone"],
    ["Veterinarian","veterinarian_name"],
    ["Veterinarian Phone","veterinarian_phone"],
    ["Emergency Vet Permission","emergency_vet_permission"]
  ],booking);

  addSection(details,"Reservation Information",[
    ["Check-in","check_in"],
    ["Check-in Time","check_in_time"],
    ["Check-out","check_out"],
    ["Check-out Time","check_out_time"],
    ["Nights","nights"],
    ["Total Price","total_price"],
    ["Hold Expires","hold_expires_at"],
    ["Request Created","created_at"]
  ],booking);

  const reasonLabel = document.createElement("label");
  reasonLabel.textContent = "Decline reason (optional)";

  const reason = document.createElement("textarea");
  reason.placeholder = "Explain why this reservation cannot be accepted...";

  const approve = document.createElement("button");
  approve.textContent = "Approve Reservation";

  const decline = document.createElement("button");
  decline.textContent = "Decline Reservation";
  decline.className = "danger";

  approve.addEventListener("click",async () => {
    if (!confirm("Approve this reservation for " + booking.dog_name + "?")) return;
    await reviewBooking("/api/admin/approve",booking.confirmation_code,{});
  });

  decline.addEventListener("click",async () => {
    if (!confirm("Decline this reservation and release its dates?")) return;
    await reviewBooking("/api/admin/decline",booking.confirmation_code,{
      decline_reason:reason.value.trim()
    });
  });

  card.append(
    title,status,summary,total,code,
    detailsButton,details,reasonLabel,reason,
    approve,decline
  );

  return card;
}

async function api(path,options={}) {
  const response = await fetch(API+path,{
    ...options,
    headers:{
      "Authorization":"Bearer "+adminToken,
      ...(options.headers||{})
    }
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Request failed.");
  }

  return data;
}

async function loadBookings() {
  $("bookings").textContent = "Loading requests...";

  try {
    const data = await api("/api/admin/bookings");

    $("bookings").replaceChildren();

    if (!data.bookings || !data.bookings.length) {
      const empty = document.createElement("p");
      empty.className = "muted";
      empty.textContent = "There are currently no pending reservations.";
      $("bookings").appendChild(empty);
      return;
    }

    data.bookings.forEach(booking => {
      $("bookings").appendChild(renderBooking(booking));
    });

    message(data.bookings.length + " pending reservation(s) found.");

  } catch(error) {
    $("bookings").textContent = error.message;
    message(error.message,"error");
  }
}

async function reviewBooking(endpoint,code,extra) {
  try {
    const result = await api(endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        confirmation_code:code,
        ...extra
      })
    });

    message(
      result.status === "confirmed"
        ? "Reservation approved. Email and text notifications still need to be configured."
        : "Reservation declined. Its dates have been released."
    );

    await loadBookings();

  } catch(error) {
    message(error.message,"error");
  }
}

$("loginForm").addEventListener("submit",async event => {
  event.preventDefault();

  adminToken = $("token").value.trim();

  try {
    await api("/api/admin/bookings");

    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("token").value = "";

    await loadBookings();

  } catch(error) {
    adminToken = "";
    alert("Login failed: " + error.message);
  }
});

$("refreshButton").addEventListener("click",loadBookings);

$("logoutButton").addEventListener("click",() => {
  adminToken = "";
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  $("bookings").replaceChildren();
});

</script>
</body>
</html>
